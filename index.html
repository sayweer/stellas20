<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first and unconditionally: browsers request /favicon.ico on their
         own, and the SPA rewrite was answering that request with index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <script>
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('everspan:theme')
        } catch {
          // Storage can be unavailable in hardened/private browser contexts.
        }
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.classList.add(
          location.pathname === '/app' || location.pathname.startsWith('/app/')
            ? 'surface-app'
            : 'surface-site',
        )
      })()
    </script>
    <title>Everspan — PT/YT Yield Splitting on Stellar</title>
    <meta
      name="description"
      content="Split any yield-bearing token into a Principal Token and a Yield Token on Stellar Testnet — the missing on-chain fixed-income primitive."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stellas20.vercel.app/" />
    <meta property="og:title" content="Everspan — lock a fixed yield on Stellar" />
    <meta
      property="og:description"
      content="Split a yield-bearing token into Principal (PT) and Yield (YT), then trade a fixed rate until maturity. Soroban · Testnet."
    />
    <meta property="og:image" content="https://stellas20.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Everspan — lock a fixed yield on Stellar" />
    <meta
      name="twitter:description"
      content="Split a yield-bearing token into Principal (PT) and Yield (YT), then trade a fixed rate until maturity. Soroban · Testnet."
    />
    <meta name="twitter:image" content="https://stellas20.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
