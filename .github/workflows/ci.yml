name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo, so the token that third-party actions run
# alongside should not be able to either.
permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (build, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz
          sudo mv stellar /usr/local/bin/
          stellar --version

      # WASM must exist before clippy/test: the Market's factory tests
      # contractimport! the real PT/YT token wasm files.
      - name: Build contracts to WASM
        run: stellar contract build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: contract-wasms
          path: target/wasm32v1-none/release/*.wasm

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which matches the npm that generated
          # package-lock.json — npm 10 (Node 22) resolves peer deps
          # differently and rejects the lock as out of sync.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
